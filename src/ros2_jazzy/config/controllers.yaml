controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # You MUST list them here first
    hip_controller:
      type: effort_controllers/JointGroupEffortController
    osl_hip_controller:
      type: effort_controllers/JointGroupEffortController
    knee_controller:
      type: effort_controllers/JointGroupEffortController
    osl_knee_controller:
      type: effort_controllers/JointGroupEffortController
    ankle_controller:
      type: effort_controllers/JointGroupEffortController
    osl_ankle_controller:
      type: effort_controllers/JointGroupEffortController

hip_controller:
  ros__parameters:
    joints: 
    - hip 

osl_hip_controller:
  ros__parameters:
    joints: 
    - osl_hip

knee_controller:
  ros__parameters:
    joints: 
    - knee

osl_knee_controller:
  ros__parameters:
    joints: 
    - osl_knee

ankle_controller:
  ros__parameters:
    joints: 
    - ankle

osl_ankle_controller:
  ros__parameters:
    joints: 
    - osl_ankle